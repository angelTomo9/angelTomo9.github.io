<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slope - Juego de Carreras 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg1: #0a0a1a;
      --bg2: #12122a;
      --accent: linear-gradient(135deg, #10b981, #3b82f6);
      --text: #f0f0ff;
      --glass: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.10);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg1);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .header {
      width: 100%;
      max-width: 960px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      background: var(--glass);
      padding: 15px 25px;
      border-radius: 16px;
      border: 1px solid var(--border);
    }
    .header h1 {
      font-size: 1.8em;
      font-weight: 800;
      background: var(--accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
    }
    .back-btn {
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      padding: 8px 16px;
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
      transition: 0.2s;
      white-space: nowrap;
    }
    .back-btn:hover {
      background: rgba(255,255,255,0.2);
    }
    .game-container {
      width: 100%;
      max-width: 960px;
      height: 640px;
      background: var(--bg2);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .instructions {
      max-width: 960px;
      margin-top: 20px;
      text-align: center;
      color: #aaa;
      font-size: 0.9em;
      line-height: 1.5;
    }
    .spacer {
      width: 130px;
    }
    @media (max-width: 768px) {
      .game-container {
        height: 400px;
      }
      .header {
        flex-direction: column;
        gap: 15px;
      }
      .spacer {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div class="header">
    <a href="../../" class="back-btn">← Volver al inicio</a>
    <h1>Slope 3D</h1>
    <div class="spacer"></div>
  </div>

  <div class="game-container">
    <iframe src="https://y8.com/embed/slope" scrolling="no" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true"></iframe>
  </div>

  <div class="instructions">
    <p><strong>Controles:</strong> Usa las flechas ⬅️ ➡️ o las teclas A y D para mover la bola.</p>
    <p>¡Esquiva los obstáculos rojos y llega lo más lejos que puedas en esta vertiginosa carrera!</p>
  </div>

</body>
</html>
