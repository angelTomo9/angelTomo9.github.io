<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Antigravity</title>
  
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Antigravity">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' },
            ag: {
              bg: '#0d1117',
              sidebar: '#161b22',
              card: '#1b202c',
              border: '#252d3d',
              input: '#121620'
            }
          }
        }
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark-dimmed.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    /* Safe Area support for Mobile */
    .safe-top { padding-top: env(safe-area-inset-top, 0px); }
    .safe-bottom { padding-bottom: max(env(safe-area-inset-bottom, 0px), 14px); }
    
    /* Scrollbars */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }

    /* Code wrapper styling matching Antigravity */
    .code-wrapper {
      margin: 0.75rem 0;
      border-radius: 0.75rem;
      overflow: hidden;
      background: #090d16;
      border: 1px solid #232936;
    }
    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.35rem 0.75rem;
      background: #111622;
      border-bottom: 1px solid #1e2533;
      font-size: 0.7rem;
      font-family: ui-monospace, SFMono-Regular, monospace;
      color: #94a3b8;
    }
    .code-header .copy-btn {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.2rem 0.5rem;
      border-radius: 0.375rem;
      background: #1e2533;
      color: #cbd5e1;
      font-size: 0.65rem;
      transition: all 0.15s ease;
    }
    .code-header .copy-btn:hover {
      background: #334155;
      color: #fff;
    }
    .code-header .copy-btn.copied {
      background: #059669;
      color: #fff;
    }
    pre {
      margin: 0 !important;
      padding: 0.75rem !important;
      font-size: 0.8rem !important;
      overflow-x: auto;
      line-height: 1.45;
    }

    /* Markdown prose styles */
    .prose p { margin-bottom: 0.65rem; }
    .prose p:last-child { margin-bottom: 0; }
    .prose ul, .prose ol { margin-left: 1.25rem; margin-bottom: 0.65rem; list-style-type: disc; }
    .prose ol { list-style-type: decimal; }
    .prose li { margin-bottom: 0.25rem; }
    .prose h1, .prose h2, .prose h3, .prose h4 {
      font-weight: 700;
      color: #f8fafc;
      margin-top: 1rem;
      margin-bottom: 0.5rem;
    }
    .prose h1 { font-size: 1.25rem; }
    .prose h2 { font-size: 1.1rem; }
    .prose h3 { font-size: 1rem; }
    .prose blockquote {
      border-left: 3px solid #6366f1;
      padding-left: 0.75rem;
      margin: 0.65rem 0;
      color: #94a3b8;
      font-style: italic;
    }
    .prose hr {
      border: 0;
      border-top: 1px solid #232936;
      margin: 1rem 0;
    }
    .prose table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.75rem 0;
      font-size: 0.8rem;
    }
    .prose th, .prose td {
      border: 1px solid #232936;
      padding: 0.4rem 0.6rem;
      text-align: left;
    }
    .prose th { background: #161b26; font-weight: 600; }

    /* Streaming pulse */
    @keyframes ag-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.95); }
    }
    .ag-indicator {
      display: inline-block;
      width: 6px;
      height: 14px;
      background: #818cf8;
      margin-left: 2px;
      vertical-align: middle;
      animation: ag-pulse 0.75s infinite;
    }
  </style>
</head>
<body class="bg-[#0d1117] text-slate-100 flex flex-col h-full w-full overflow-hidden select-none font-sans">

  <!-- TOP APP HEADER -->
  <header class="flex-none h-14 bg-[#121620]/95 backdrop-blur-md border-b border-[#1f2636] flex items-center justify-between px-3 z-20 safe-top">
    <div class="flex items-center gap-2 overflow-hidden">
      <!-- Drawer Menu Toggle -->
      <button id="btnOpenDrawer" class="h-9 w-9 rounded-xl bg-[#1b202c] active:bg-[#252d3d] text-slate-300 flex items-center justify-center shrink-0 border border-[#252d3d]" aria-label="Menu">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
      </button>

      <!-- Center Brand & Project Info -->
      <div id="headerTitleArea" class="flex flex-col truncate cursor-pointer pl-1">
        <div class="flex items-center gap-1.5">
          <!-- Antigravity Diamond Logo -->
          <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="#818cf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 17L12 22L22 17" stroke="#c084fc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 12L12 17L22 12" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="text-xs font-bold text-white tracking-wide">Antigravity</span>
          <span class="text-slate-600 text-xs">•</span>
          <span id="headerProjectName" class="text-[11px] font-semibold text-indigo-400 truncate max-w-[110px]">Jarvis</span>
          <span id="connectionBadge" class="w-2 h-2 rounded-full bg-emerald-400 inline-block animate-pulse"></span>
        </div>
        <span id="headerChatTitle" class="text-xs font-medium text-slate-300 truncate max-w-[170px]">Cargando conversación...</span>
      </div>
    </div>

    <!-- Header Actions (Sync 🔄 + New +) -->
    <div class="flex items-center gap-1.5">
      <button id="btnSyncHeader" class="h-9 w-9 rounded-xl bg-[#1b202c] active:bg-[#252d3d] text-indigo-400 border border-[#252d3d] flex items-center justify-center shrink-0 transition" title="Sincronizar">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/></svg>
      </button>

      <button id="btnNewChatHeader" class="h-9 px-3 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 active:opacity-90 text-white font-bold text-xs flex items-center gap-1 shadow-md shadow-indigo-600/30">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        <span>Nuevo</span>
      </button>
    </div>
  </header>

  <!-- CHAT MESSAGES SCROLL VIEW -->
  <main id="chatScrollContainer" class="flex-1 overflow-y-auto px-3 py-4 space-y-5 select-text">
    <div id="messagesList" class="max-w-3xl mx-auto space-y-5 pb-6">
      <!-- Dynamic Messages rendered here -->
    </div>
  </main>

  <!-- BOTTOM INPUT COMMAND BAR (Antigravity Style) -->
  <footer class="flex-none bg-[#10141d]/95 backdrop-blur-md border-t border-[#1f2636] px-3 pt-2.5 pb-3 safe-bottom z-30">
    
    <!-- Image Previews Container -->
    <div id="imagePreviewContainer" class="max-w-3xl mx-auto mb-2 flex items-center gap-2 overflow-x-auto hidden"></div>

    <div class="max-w-3xl mx-auto bg-[#161b26] border border-[#252d3d] rounded-2xl p-2 focus-within:border-indigo-500/70 focus-within:ring-1 focus-within:ring-indigo-500/30 shadow-lg">
      <form id="chatForm" class="flex items-end gap-2">
        
        <!-- Hidden File Input -->
        <input type="file" id="imageFileInput" accept="image/*" class="hidden">

        <!-- Attachment Button -->
        <button
          id="btnAttachImage"
          type="button"
          class="h-9 w-9 rounded-xl bg-[#1b212f] hover:bg-[#252d3d] active:scale-95 text-slate-400 hover:text-indigo-400 flex items-center justify-center shrink-0 border border-[#262f42] transition"
          aria-label="Adjuntar foto"
          title="Adjuntar imagen"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>

        <!-- Prompt Textarea Input -->
        <textarea
          id="messageInput"
          rows="1"
          placeholder="Escribe una instrucción a Antigravity..."
          class="flex-1 bg-transparent text-slate-100 text-sm placeholder-slate-500 px-1 py-1 outline-none resize-none max-h-36 leading-relaxed"
          style="min-height: 28px;"
        ></textarea>

        <!-- Send Button -->
        <button
          id="btnSendMessage"
          type="submit"
          class="h-9 w-9 rounded-xl bg-indigo-600 active:bg-indigo-700 disabled:opacity-40 disabled:pointer-events-none text-white flex items-center justify-center shrink-0 shadow-md shadow-indigo-600/30 transition"
          aria-label="Enviar instrucción"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
        </button>
      </form>

      <!-- Bottom Status Pill -->
      <div class="flex items-center justify-between mt-1 px-1 pt-1 border-t border-[#1e2536] text-[10px] text-slate-500">
        <span class="flex items-center gap-1 font-mono">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block"></span>
          <span>Gemini 3.8 Flash (PC)</span>
        </span>
        <span id="connectionText" class="text-emerald-400 font-semibold">PC Conectado</span>
      </div>
    </div>
  </footer>

  <!-- LEFT DRAWER (ANTIGRAVITY EXPLORER) -->
  <div id="drawerOverlay" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-40 hidden opacity-0 transition-opacity duration-200"></div>
  <aside id="drawerSidebar" class="fixed top-0 bottom-0 left-0 w-84 max-w-[88vw] bg-[#121620] border-r border-[#1f2636] z-50 flex flex-col -translate-x-full transition-transform duration-200 shadow-2xl safe-top">
    
    <!-- Drawer Top Header -->
    <div class="h-14 border-b border-[#1f2636] flex items-center justify-between px-4 bg-[#141924]">
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center text-white font-bold text-xs shadow-md">
          AG
        </div>
        <div class="flex flex-col">
          <span class="font-bold text-slate-100 text-xs">Antigravity Explorer</span>
          <span class="text-[10px] text-slate-500">Windows PC Hub</span>
        </div>
      </div>
      <button id="btnCloseDrawer" class="p-1.5 text-slate-400 hover:text-white rounded-lg bg-[#1b202c]">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>

    <!-- Project Filter Dropdown -->
    <div class="p-3 border-b border-[#1f2636] bg-[#0d1117]/60">
      <div class="flex items-center justify-between mb-1">
        <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400">
          📁 Proyecto Activo
        </label>
      </div>
      <select id="projectSelect" class="w-full bg-[#1b202c] border border-[#252d3d] rounded-xl px-3 py-2 text-xs font-semibold text-slate-200 outline-none focus:border-indigo-500">
        <!-- Projects populated dynamically -->
      </select>
    </div>

    <!-- Search Input -->
    <div class="p-2.5 border-b border-[#1f2636]">
      <div class="flex items-center gap-2 bg-[#161b26] border border-[#252d3d] rounded-xl px-3 py-1.5 text-xs">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="chatSearchInput" type="text" placeholder="Buscar sesión..." class="w-full bg-transparent text-slate-200 placeholder-slate-500 outline-none">
      </div>
    </div>

    <!-- Session List Header -->
    <div class="px-3 pt-3 pb-1.5 flex items-center justify-between">
      <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">
        Sesiones de Chat
      </span>
      <button id="btnNewChatDrawer" class="text-xs text-indigo-400 hover:text-indigo-300 font-bold">
        + Nueva
      </button>
    </div>

    <!-- Chats Scrollable Container -->
    <div id="chatsListContainer" class="flex-1 overflow-y-auto px-2 space-y-1.5 pb-6">
      <!-- Chats populated dynamically -->
    </div>

    <!-- Drawer Footer -->
    <div class="p-3 border-t border-[#1f2636] bg-[#141924] flex items-center justify-between text-xs text-slate-400 safe-bottom">
      <span class="text-[11px]">Motor Antigravity PC</span>
      <span class="text-emerald-400 font-bold text-[11px] flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-emerald-400"></span> Conectado
      </span>
    </div>
  </aside>

  <!-- MODAL: LOGIN / PASSWORD PROMPT -->
  <div id="loginModal" class="fixed inset-0 bg-[#0b0f17] z-50 flex items-center justify-center p-4">
    <div class="bg-[#121620] border border-[#252d3d] rounded-3xl w-full max-w-sm p-6 text-center space-y-4 shadow-2xl">
      <div class="w-14 h-14 rounded-2xl bg-indigo-600/20 text-indigo-400 mx-auto flex items-center justify-center border border-indigo-500/30">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <div>
        <h2 class="text-xl font-bold text-white">Antigravity Hub</h2>
        <p class="text-xs text-slate-400 mt-1">Introduce la contraseña de acceso</p>
      </div>
      <form id="loginForm" class="space-y-3">
        <input
          id="loginPinInput"
          type="password"
          placeholder="Contraseña"
          class="w-full text-center tracking-widest text-base font-mono bg-[#161b26] border border-[#252d3d] rounded-xl px-4 py-3 text-white outline-none focus:border-indigo-500"
          autofocus
        />
        <div id="loginError" class="text-xs text-rose-400 hidden">Contraseña incorrecta</div>
        <button type="submit" class="w-full py-3 bg-gradient-to-r from-indigo-600 to-purple-600 active:opacity-90 text-white font-bold rounded-xl text-sm shadow-lg shadow-indigo-600/30">
          Entrar y Conectar
        </button>
      </form>
    </div>
  </div>

  <!-- APPLICATION LOGIC -->
  <script>
    const REQUIRED_PASSWORD = "3789bt25";
    const BROKER_WSS = "wss://broker.emqx.io:8084/mqtt";
    const TOPIC_TO_PC = "antigravity/angel-3789bt25/to_pc";
    const TOPIC_FROM_PC = "antigravity/angel-3789bt25/from_pc";

    const state = {
      isAuthenticated: localStorage.getItem('ag_auth_pass') === REQUIRED_PASSWORD,
      currentProjectId: localStorage.getItem('ag_proj_id') || 'all',
      currentChatId: localStorage.getItem('ag_chat_id') || null,
      projects: [],
      chats: [],
      attachedImages: [],
      isStreaming: false,
      pcOnline: false,
      lastHeartbeat: 0,
      mqttClient: null
    };

    // Configure Markdown & Highlight.js
    marked.setOptions({
      highlight: function(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          try { return hljs.highlight(code, { language: lang }).value; } catch (__) {}
        }
        return hljs.highlightAuto(code).value;
      },
      breaks: true,
      gfm: true
    });

    const renderer = new marked.Renderer();
    renderer.code = function(code, lang) {
      const language = (lang || 'código').toLowerCase();
      const highlighted = lang && hljs.getLanguage(lang)
        ? hljs.highlight(code, { language: lang }).value
        : hljs.highlightAuto(code).value;
      
      return '<div class="code-wrapper"><div class="code-header"><span>' + language + '</span><button class="copy-btn" onclick="copyCode(this)"><svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg> Copiar</button></div><pre><code>' + highlighted + '</code></pre></div>';
    };
    marked.use({ renderer });

    window.copyCode = function(btn) {
      const wrapper = btn.closest('.code-wrapper');
      const codeEl = wrapper.querySelector('pre code');
      navigator.clipboard.writeText(codeEl.innerText).then(() => {
        btn.classList.add('copied');
        btn.innerHTML = '✓ Copiado';
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg> Copiar';
        }, 2000);
      });
    };

    // DOM Elements
    const loginModal = document.getElementById('loginModal');
    const loginForm = document.getElementById('loginForm');
    const loginPinInput = document.getElementById('loginPinInput');
    const loginError = document.getElementById('loginError');

    const connectionBadge = document.getElementById('connectionBadge');
    const connectionText = document.getElementById('connectionText');
    const btnSyncHeader = document.getElementById('btnSyncHeader');

    const drawerOverlay = document.getElementById('drawerOverlay');
    const drawerSidebar = document.getElementById('drawerSidebar');
    const btnOpenDrawer = document.getElementById('btnOpenDrawer');
    const btnCloseDrawer = document.getElementById('btnCloseDrawer');

    const headerTitleArea = document.getElementById('headerTitleArea');
    const headerProjectName = document.getElementById('headerProjectName');
    const headerChatTitle = document.getElementById('headerChatTitle');
    const projectSelect = document.getElementById('projectSelect');

    const chatsListContainer = document.getElementById('chatsListContainer');
    const chatSearchInput = document.getElementById('chatSearchInput');
    const btnNewChatHeader = document.getElementById('btnNewChatHeader');
    const btnNewChatDrawer = document.getElementById('btnNewChatDrawer');

    const messagesList = document.getElementById('messagesList');
    const chatScrollContainer = document.getElementById('chatScrollContainer');

    const chatForm = document.getElementById('chatForm');
    const messageInput = document.getElementById('messageInput');
    const btnSendMessage = document.getElementById('btnSendMessage');
    const btnAttachImage = document.getElementById('btnAttachImage');
    const imageFileInput = document.getElementById('imageFileInput');
    const imagePreviewContainer = document.getElementById('imagePreviewContainer');

    function checkAuth() {
      if (!state.isAuthenticated) {
        loginModal.classList.remove('hidden');
        loginPinInput.value = '';
        loginPinInput.focus();
      } else {
        loginModal.classList.add('hidden');
        initBridge();
      }
    }

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = loginPinInput.value.trim();
      if (val === REQUIRED_PASSWORD) {
        state.isAuthenticated = true;
        localStorage.setItem('ag_auth_pass', REQUIRED_PASSWORD);
        loginModal.classList.add('hidden');
        initBridge();
      } else {
        loginError.textContent = 'Contraseña incorrecta';
        loginError.classList.remove('hidden');
      }
    });

    function updateConnectionUI(online) {
      state.pcOnline = online;
      if (online) {
        connectionBadge.className = 'w-2 h-2 rounded-full bg-emerald-400 inline-block animate-pulse';
        connectionText.textContent = 'PC Conectado';
        connectionText.className = 'text-emerald-400 font-semibold';
      } else {
        connectionBadge.className = 'w-2 h-2 rounded-full bg-amber-400 inline-block animate-pulse';
        connectionText.textContent = 'Buscando PC...';
        connectionText.className = 'text-amber-400 font-semibold';
      }
    }

    function initBridge() {
      updateConnectionUI(false);

      state.mqttClient = mqtt.connect(BROKER_WSS, {
        reconnectPeriod: 2000,
        keepalive: 30
      });

      state.mqttClient.on('connect', () => {
        console.log('✅ Conectado al broker WSS en la nube');
        state.mqttClient.subscribe(TOPIC_FROM_PC, (err) => {
          if (!err) {
            requestPCData();
            if (state.currentChatId) {
              loadChatFromPC(state.currentChatId);
            }
          }
        });
      });

      state.mqttClient.on('message', (topic, payload) => {
        try {
          const msg = JSON.parse(payload.toString());
          handlePCMessage(msg);
        } catch(e) {
          console.error('Error procesando mensaje MQTT:', e);
        }
      });

      // Heartbeat Monitor
      setInterval(() => {
        const isAlive = (Date.now() - state.lastHeartbeat) < 8000;
        updateConnectionUI(isAlive);
      }, 3000);

      // Auto-sync on visibility change (mobile app resume)
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          requestPCData();
          if (state.currentChatId) {
            loadChatFromPC(state.currentChatId);
          }
        }
      });

      // Unregister any old service worker caches
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          for (const reg of registrations) {
            reg.update();
          }
        });
      }
    }

    function requestPCData() {
      sendToPC({ action: 'get_data', reqId: 'req-data-' + Date.now() });
    }

    function sendToPC(data) {
      if (state.mqttClient && state.mqttClient.connected) {
        state.mqttClient.publish(TOPIC_TO_PC, JSON.stringify(data));
      }
    }

    function handlePCMessage(msg) {
      if (msg.type === 'heartbeat') {
        state.lastHeartbeat = Date.now();
        updateConnectionUI(true);
      } else if (msg.type === 'data_response') {
        state.lastHeartbeat = Date.now();
        updateConnectionUI(true);
        if (msg.data) {
          state.projects = msg.data.projects || [];
          state.chats = msg.data.chats || [];
          renderProjectSelect();
          renderFilteredChats();

          if (state.chats.length > 0) {
            if (!state.currentChatId || !state.chats.some(c => c.id === state.currentChatId)) {
              state.currentChatId = state.chats[0].id;
            }
            loadChatFromPC(state.currentChatId);
          }
        }
      } else if (msg.type === 'chat_response') {
        if (msg.chat) {
          state.currentChatId = msg.chat.id;
          localStorage.setItem('ag_chat_id', msg.chat.id);
          renderChatMessages(msg.chat);
        }
      } else if (msg.type === 'chunk') {
        if (msg.chatId === state.currentChatId) {
          const activeAiBox = document.querySelector('.active-ai-stream-box');
          if (activeAiBox) {
            activeAiBox.innerHTML = marked.parse(msg.text) + '<span class="ag-indicator"></span>';
            scrollToBottom();
          }
        }
      } else if (msg.type === 'done') {
        state.isStreaming = false;
        btnSendMessage.disabled = false;
        if (msg.chat && msg.chat.id === state.currentChatId) {
          renderChatMessages(msg.chat);
        }
        requestPCData();
      } else if (msg.type === 'new_chat_created') {
        state.isStreaming = false;
        btnSendMessage.disabled = false;
        if (msg.newChat) {
          state.currentChatId = msg.newChat.id;
          localStorage.setItem('ag_chat_id', msg.newChat.id);
          requestPCData();
          closeDrawer();
          loadChatFromPC(msg.newChat.id);
        }
      }
    }

    // Drawer Controls
    function openDrawer() {
      drawerOverlay.classList.remove('hidden');
      setTimeout(() => {
        drawerOverlay.classList.remove('opacity-0');
        drawerSidebar.classList.remove('-translate-x-full');
      }, 10);
    }

    function closeDrawer() {
      drawerOverlay.classList.add('opacity-0');
      drawerSidebar.classList.add('-translate-x-full');
      setTimeout(() => drawerOverlay.classList.add('hidden'), 220);
    }

    btnOpenDrawer.addEventListener('click', openDrawer);
    headerTitleArea.addEventListener('click', openDrawer);
    btnCloseDrawer.addEventListener('click', closeDrawer);
    drawerOverlay.addEventListener('click', closeDrawer);

    // Sync Button in Header
    if (btnSyncHeader) {
      btnSyncHeader.addEventListener('click', () => {
        const icon = btnSyncHeader.querySelector('svg');
        if (icon) icon.classList.add('animate-spin');
        requestPCData();
        if (state.currentChatId) {
          loadChatFromPC(state.currentChatId);
        }
        setTimeout(() => {
          if (icon) icon.classList.remove('animate-spin');
        }, 900);
      });
    }

    // Image attachment
    btnAttachImage.addEventListener('click', () => imageFileInput.click());
    imageFileInput.addEventListener('change', (e) => {
      Array.from(e.target.files).forEach(file => {
        const reader = new FileReader();
        reader.onload = (event) => {
          state.attachedImages.push({ name: file.name, data: event.target.result });
          renderImagePreviews();
        };
        reader.readAsDataURL(file);
      });
      imageFileInput.value = '';
    });

    function renderImagePreviews() {
      if (state.attachedImages.length === 0) {
        imagePreviewContainer.classList.add('hidden');
        imagePreviewContainer.innerHTML = '';
        return;
      }
      imagePreviewContainer.classList.remove('hidden');
      imagePreviewContainer.innerHTML = '';
      state.attachedImages.forEach((img, idx) => {
        const thumb = document.createElement('div');
        thumb.className = 'relative inline-block shrink-0';
        thumb.innerHTML = '<img src="' + img.data + '" class="w-14 h-14 object-cover rounded-xl border border-indigo-500 shadow"><button type="button" class="absolute -top-1 -right-1 w-5 h-5 bg-rose-600 text-white rounded-full flex items-center justify-center text-xs font-bold shadow" onclick="removeAttachedImage(' + idx + ')">✕</button>';
        imagePreviewContainer.appendChild(thumb);
      });
    }

    window.removeAttachedImage = function(index) {
      state.attachedImages.splice(index, 1);
      renderImagePreviews();
    };

    messageInput.addEventListener('input', () => {
      messageInput.style.height = 'auto';
      messageInput.style.height = Math.min(messageInput.scrollHeight, 140) + 'px';
    });

    function renderProjectSelect() {
      projectSelect.innerHTML = '';
      state.projects.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.id;
        const countStr = p.chatCount > 0 ? (' (' + p.chatCount + ')') : '';
        opt.textContent = p.name + countStr;
        projectSelect.appendChild(opt);
      });
      projectSelect.value = state.currentProjectId;
      updateHeaderProjectName();
    }

    function updateHeaderProjectName() {
      const p = state.projects.find(x => x.id === state.currentProjectId);
      if (p) headerProjectName.textContent = p.name.replace(/^[📁🌟]\s*/, '');
    }

    projectSelect.addEventListener('change', () => {
      state.currentProjectId = projectSelect.value;
      localStorage.setItem('ag_proj_id', state.currentProjectId);
      updateHeaderProjectName();
      renderFilteredChats();

      const available = getFilteredChats();
      if (available.length > 0) {
        state.currentChatId = available[0].id;
        loadChatFromPC(state.currentChatId);
      }
    });

    function getFilteredChats() {
      let list = state.chats;
      if (state.currentProjectId !== 'all') {
        list = list.filter(c => c.projectId === state.currentProjectId);
      }
      const q = chatSearchInput.value.toLowerCase().trim();
      if (q) {
        list = list.filter(c => c.title.toLowerCase().includes(q) || (c.projectName && c.projectName.toLowerCase().includes(q)));
      }
      return list;
    }

    chatSearchInput.addEventListener('input', () => renderFilteredChats());

    function renderFilteredChats() {
      const list = getFilteredChats();
      chatsListContainer.innerHTML = '';

      list.forEach(chat => {
        const isActive = chat.id === state.currentChatId;
        const item = document.createElement('div');
        item.className = 'p-2.5 rounded-xl cursor-pointer transition flex items-center justify-between gap-2 ' + 
          (isActive 
            ? 'bg-indigo-600/20 text-white border border-indigo-500/50 shadow-sm' 
            : 'text-slate-300 hover:bg-[#1b212f] border border-transparent');

        const projBadge = chat.projectName ? ('<span class="text-[9px] bg-[#1a202e] text-indigo-300 px-1.5 py-0.5 rounded font-mono">' + escapeHtml(chat.projectName) + '</span>') : '';

        item.innerHTML = '<div class="flex items-center gap-2 overflow-hidden flex-1"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="' + (isActive ? '#818cf8' : '#64748b') + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="text-xs font-semibold truncate">' + escapeHtml(chat.title) + '</span></div><div class="flex items-center gap-1 shrink-0">' + projBadge + '<span class="text-[10px] text-slate-500">' + (chat.messageCount || 0) + '</span></div>';

        item.addEventListener('click', () => {
          state.currentChatId = chat.id;
          localStorage.setItem('ag_chat_id', chat.id);
          renderFilteredChats();
          closeDrawer();
          loadChatFromPC(chat.id);
        });

        chatsListContainer.appendChild(item);
      });
    }

    function loadChatFromPC(chatId) {
      if (!chatId) return;

      const chatMeta = state.chats.find(c => c.id === chatId);
      if (chatMeta) {
        headerChatTitle.textContent = chatMeta.title || 'Conversación';
        if (chatMeta.projectName) headerProjectName.textContent = chatMeta.projectName;
      }

      sendToPC({
        action: 'get_chat',
        chatId: chatId,
        reqId: 'req-chat-' + Date.now()
      });
    }

    function renderChatMessages(chat) {
      headerChatTitle.textContent = chat.title || 'Conversación';
      if (chat.projectName) headerProjectName.textContent = chat.projectName;

      messagesList.innerHTML = '';
      if (!chat.messages || chat.messages.length === 0) {
        messagesList.innerHTML = '<div class="text-center py-20 text-slate-500 space-y-3"><div class="w-12 h-12 rounded-2xl bg-indigo-600/10 text-indigo-400 border border-indigo-500/20 flex items-center justify-center mx-auto text-xl">✨</div><p class="text-sm font-bold text-slate-300">Sesión iniciada</p><p class="text-xs text-slate-500 max-w-xs mx-auto">Escribe cualquier instrucción para ejecutarla con Antigravity en tu PC.</p></div>';
        return;
      }

      chat.messages.forEach(msg => {
        appendMessageElement(msg.role, msg.content, msg.timestamp, msg.images);
      });
      scrollToBottom();
    }

    function appendMessageElement(role, content, timestamp, images) {
      const isUser = role === 'user';
      const msgEl = document.createElement('div');
      msgEl.className = 'flex gap-3 ' + (isUser ? 'justify-end' : 'justify-start');

      const renderedHtml = marked.parse(content || '');
      const timeFormatted = new Date(timestamp || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      let imagesHtml = '';
      if (Array.isArray(images) && images.length > 0) {
        imagesHtml = '<div class="flex flex-wrap gap-2 mb-2">' + images.map(imgUrl => '<img src="' + imgUrl + '" class="max-h-56 rounded-xl object-cover border border-[#252d3d] shadow-md">').join('') + '</div>';
      }

      if (isUser) {
        msgEl.innerHTML = '<div class="flex flex-col items-end max-w-[85%] sm:max-w-[78%]">' + imagesHtml + (content ? ('<div class="bg-[#1e2536] border border-[#2c364d] text-slate-100 rounded-2xl rounded-tr-sm px-4 py-2.5 shadow-md text-sm leading-relaxed select-text">' + escapeHtml(content) + '</div>') : '') + '<span class="text-[10px] text-slate-500 mt-1 mr-1 font-mono">' + timeFormatted + '</span></div>';
      } else {
        msgEl.innerHTML = '<div class="flex gap-2.5 max-w-[94%] sm:max-w-[85%]"><div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center text-white font-bold text-[10px] shrink-0 mt-1 shadow">AG</div><div class="flex flex-col flex-1 overflow-hidden">' + imagesHtml + '<div class="flex items-center gap-2 mb-1 pl-1"><span class="font-bold text-xs text-slate-200">Antigravity</span><span class="text-[9px] px-1.5 py-0.5 rounded bg-indigo-500/10 text-indigo-400 font-mono border border-indigo-500/20 font-semibold">Gemini 3.8 Flash</span><span class="text-[10px] text-slate-500 font-mono">' + timeFormatted + '</span></div><div class="bg-[#141924] border border-[#222838] text-slate-200 rounded-2xl rounded-tl-sm px-4 py-3 shadow-md prose select-text overflow-x-auto leading-relaxed">' + renderedHtml + '</div></div></div>';
      }

      messagesList.appendChild(msgEl);
      return msgEl;
    }

    function createNewChat() {
      const promptText = prompt('Instrucción para la nueva sesión de Antigravity:', 'Hola');
      if (!promptText) return;

      state.isStreaming = true;
      btnSendMessage.disabled = true;

      messagesList.innerHTML = '<div class="text-center py-20 text-slate-500 space-y-2"><div class="w-8 h-8 rounded-full border-2 border-indigo-500 border-t-transparent animate-spin mx-auto"></div><p class="text-xs text-indigo-400 font-bold">Creando sesión en Antigravity PC...</p></div>';

      sendToPC({
        action: 'new_chat',
        prompt: promptText,
        reqId: 'req-new-' + Date.now()
      });
    }

    btnNewChatHeader.addEventListener('click', createNewChat);
    btnNewChatDrawer.addEventListener('click', createNewChat);

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (state.isStreaming) return;

      const content = messageInput.value.trim();
      const imagesToSend = [...state.attachedImages];

      if (!content && imagesToSend.length === 0) return;
      if (!state.currentChatId) return;

      messageInput.value = '';
      messageInput.style.height = 'auto';
      state.attachedImages = [];
      renderImagePreviews();

      appendMessageElement('user', content, new Date().toISOString(), imagesToSend.map(i => i.data));
      scrollToBottom();

      state.isStreaming = true;
      btnSendMessage.disabled = true;

      const aiMsgContainer = document.createElement('div');
      aiMsgContainer.className = 'flex gap-2.5 max-w-[94%] sm:max-w-[85%] justify-start';
      aiMsgContainer.innerHTML = '<div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center text-white font-bold text-[10px] shrink-0 mt-1 shadow">AG</div><div class="flex flex-col flex-1"><div class="flex items-center gap-2 mb-1 pl-1"><span class="font-bold text-xs text-slate-200">Antigravity</span><span class="text-[9px] px-1.5 py-0.5 rounded bg-indigo-500/10 text-indigo-400 font-mono border border-indigo-500/20 font-semibold">Pensando...</span></div><div class="active-ai-stream-box bg-[#141924] border border-[#222838] text-slate-300 rounded-2xl rounded-tl-sm px-4 py-3 shadow-md text-xs leading-relaxed"><span class="ag-indicator"></span> Antigravity ejecutando en tu PC...</div></div>';
      messagesList.appendChild(aiMsgContainer);
      scrollToBottom();

      sendToPC({
        action: 'send_message',
        chatId: state.currentChatId,
        content: content,
        images: imagesToSend,
        reqId: 'req-msg-' + Date.now()
      });
    });

    function scrollToBottom() {
      chatScrollContainer.scrollTop = chatScrollContainer.scrollHeight;
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    checkAuth();
  </script>
</body>
</html>
