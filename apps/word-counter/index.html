<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contador de Palabras — Herramientas de Ángel</title>
<meta name="description" content="Contador de palabras, caracteres, frases y párrafos en tiempo real. Herramienta gratuita y fácil de usar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-dark: #0a0a1a;
  --bg-card: rgba(20, 20, 40, 0.6);
  --primary: #f7971e;
  --secondary: #ffd200;
  --accent: #4488ff;
  --text-main: #ffffff;
  --text-muted: #94a3b8;
  --glass-border: rgba(255, 255, 255, 0.1);
  --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Outfit', sans-serif;
  background-color: var(--bg-dark);
  background-image: 
    radial-gradient(circle at 15% 50%, rgba(247, 151, 30, 0.15), transparent 25%),
    radial-gradient(circle at 85% 30%, rgba(68, 136, 255, 0.15), transparent 25%);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 2rem 1rem;
}

.container {
  max-width: 800px;
  width: 100%;
  animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

header {
  text-align: center;
  margin-bottom: 2.5rem;
}

h1 {
  font-size: 2.8rem;
  font-weight: 800;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 0.5rem;
  letter-spacing: -0.05em;
  filter: drop-shadow(0 4px 12px rgba(247, 151, 30, 0.3));
}

.subtitle {
  color: var(--text-muted);
  font-size: 1.1rem;
  font-weight: 300;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 1rem;
  margin-bottom: 2rem;
}

.stat-card {
  background: var(--bg-card);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  padding: 1.5rem;
  text-align: center;
  box-shadow: var(--glass-shadow);
  transition: transform 0.3s ease, border-color 0.3s ease;
}

.stat-card:hover {
  transform: translateY(-5px);
  border-color: rgba(247, 151, 30, 0.4);
}

.stat-value {
  font-size: 2.5rem;
  font-weight: 800;
  color: var(--text-main);
  margin-bottom: 0.25rem;
  font-variant-numeric: tabular-nums;
  line-height: 1.2;
}

.stat-label {
  color: var(--text-muted);
  font-size: 0.9rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.editor-wrapper {
  background: var(--bg-card);
  backdrop-filter: blur(12px);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  padding: 1rem;
  box-shadow: var(--glass-shadow);
  position: relative;
  transition: border-color 0.3s ease;
}

.editor-wrapper:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(68, 136, 255, 0.2), var(--glass-shadow);
}

textarea {
  width: 100%;
  min-height: 300px;
  background: transparent;
  border: none;
  color: var(--text-main);
  font-family: inherit;
  font-size: 1.1rem;
  line-height: 1.6;
  resize: vertical;
  outline: none;
  padding: 1rem;
}

textarea::placeholder {
  color: rgba(148, 163, 184, 0.5);
}

.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 1.5rem;
  padding: 0 0.5rem;
}

.btn {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--glass-border);
  color: var(--text-main);
  padding: 0.8rem 1.5rem;
  border-radius: 12px;
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
}

.btn:hover {
  background: rgba(255, 255, 255, 0.1);
  transform: translateY(-2px);
}

.btn:active {
  transform: translateY(0);
}

.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  color: #000;
  border: none;
}

.btn-primary:hover {
  background: linear-gradient(135deg, #ffaa33, #ffe033);
  box-shadow: 0 4px 15px rgba(247, 151, 30, 0.4);
}

.toast {
  position: fixed;
  bottom: 2rem;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--text-main);
  color: var(--bg-dark);
  padding: 0.8rem 1.5rem;
  border-radius: 99px;
  font-weight: 600;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  opacity: 0;
  transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  z-index: 1000;
}

.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

.back-link {
  display: inline-block;
  margin-top: 3rem;
  color: var(--accent);
  text-decoration: none;
  font-weight: 600;
  transition: opacity 0.2s;
}

.back-link:hover {
  opacity: 0.8;
  text-decoration: underline;
}

@media (max-width: 600px) {
  .stats-grid {
    grid-template-columns: 1fr 1fr;
  }
  h1 { font-size: 2.2rem; }
  .stat-value { font-size: 2rem; }
}
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Contador de Palabras</h1>
    <p class="subtitle">Escribe o pega tu texto abajo para analizarlo en tiempo real</p>
  </header>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-value" id="word-count">0</div>
      <div class="stat-label">Palabras</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="char-count">0</div>
      <div class="stat-label">Caracteres</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="sentence-count">0</div>
      <div class="stat-label">Frases</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="paragraph-count">0</div>
      <div class="stat-label">Párrafos</div>
    </div>
  </div>

  <div class="editor-wrapper">
    <textarea id="text-input" placeholder="Comienza a escribir aquí..."></textarea>
  </div>

  <div class="toolbar">
    <button class="btn" id="clear-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
      Limpiar
    </button>
    <button class="btn btn-primary" id="copy-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
      Copiar Texto
    </button>
  </div>

  <div style="text-align: center;">
    <a href="/" class="back-link">← Volver a inicio</a>
  </div>
</div>

<div class="toast" id="toast">Texto copiado al portapapeles</div>

<script>
  const textInput = document.getElementById('text-input');
  const wordCountDisplay = document.getElementById('word-count');
  const charCountDisplay = document.getElementById('char-count');
  const sentenceCountDisplay = document.getElementById('sentence-count');
  const paragraphCountDisplay = document.getElementById('paragraph-count');
  const clearBtn = document.getElementById('clear-btn');
  const copyBtn = document.getElementById('copy-btn');
  const toast = document.getElementById('toast');

  function analyzeText() {
    const text = textInput.value;
    
    // Character count (including spaces)
    charCountDisplay.textContent = text.length;

    if (text.trim() === '') {
      wordCountDisplay.textContent = '0';
      sentenceCountDisplay.textContent = '0';
      paragraphCountDisplay.textContent = '0';
      return;
    }

    // Word count
    const words = text.trim().split(/\s+/);
    wordCountDisplay.textContent = words.length;

    // Sentence count (splitting by ., !, ?)
    const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 0);
    sentenceCountDisplay.textContent = sentences.length;

    // Paragraph count (splitting by newlines)
    const paragraphs = text.split(/\n+/).filter(p => p.trim().length > 0);
    paragraphCountDisplay.textContent = paragraphs.length;
  }

  // Event Listeners
  textInput.addEventListener('input', analyzeText);

  clearBtn.addEventListener('click', () => {
    textInput.value = '';
    analyzeText();
    textInput.focus();
  });

  copyBtn.addEventListener('click', () => {
    if (textInput.value.length === 0) return;
    
    navigator.clipboard.writeText(textInput.value).then(() => {
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    });
  });

  // Initial focus
  textInput.focus();
</script>
</body>
</html>
